# ==============================================================================
# CF STALKER — RENDER BLUEPRINT DEPLOYMENT SPECIFICATION
# Official 6-Component Architecture Specification for Render.com
# ==============================================================================

services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: cf-stalker-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    preDeployCommand: alembic upgrade head
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cf-stalker-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: cf-stalker-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: cf-stalker-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: cf-stalker-redis
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://cf-stalker-frontend.onrender.com

  # 2. Celery Worker (Background Ingestion Engine)
  - type: worker
    name: cf-stalker-celery-worker
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.core.celery_app.celery_app worker --loglevel=info -c 4
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cf-stalker-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: cf-stalker-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: cf-stalker-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: cf-stalker-redis
          property: connectionString

  # 3. Celery Beat (Periodic Task Scheduler)
  - type: worker
    name: cf-stalker-celery-beat
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.core.celery_app.celery_app beat --loglevel=info
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: cf-stalker-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: cf-stalker-redis
          property: connectionString

  # 4. React Frontend (Static Web Site)
  - type: web
    name: cf-stalker-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://cf-stalker-backend.onrender.com/api/v1

  # 5. Managed Redis Instance
  - type: redis
    name: cf-stalker-redis
    ipAllowList: []

databases:
  # 6. Managed PostgreSQL Database
  - name: cf-stalker-db
    databaseName: cf_stalker
    user: cf_stalker_user
