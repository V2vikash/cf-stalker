# ==============================================================================
# CF STALKER — RENDER BLUEPRINT DEPLOYMENT SPECIFICATION (ZERO PAID SERVICES)
# Official 3-Component Architecture Specification for Render.com Free Tier
# ==============================================================================

services:
  # 1. FastAPI Backend Web Service (Free Tier)
  - type: web
    name: cf-stalker-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: job-intelligence-platform-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://cf-stalker-frontend.onrender.com

  # 2. React Frontend Static Site (Free Tier)
  - type: web
    name: cf-stalker-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://cf-stalker-backend.onrender.com/api/v1
