[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "cf-stalker-backend"
version = "0.1.0"
description = "FastAPI Backend for CF Stalker"
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 100
target-version = "py311"
